[tox]
requires =
    tox>=4.2
# lowest includes jax 0.4.36 as well as all other dependencies in lowest version
env_list =
    py312-lowest
    py312-jax{0.5.3, 0.6.2, 0.7.2, 0.8.2, 0.9.1}

[testenv]
runner = uv-venv-lock-runner
package = editable
pass_env =
    *
commands_pre =
    jax0.5.3: uv pip install jax==0.5.3 flax==0.10.6 orbax-checkpoint==0.11.24 chex==0.1.90 distrax==0.1.5
    jax0.6.2: uv pip install jax==0.6.2 flax==0.11.2 chex==0.1.90 distrax==0.1.5
    jax0.7.2: uv pip install jax==0.7.2 flax==0.12.0
    jax0.8.2: uv pip install jax==0.8.2
commands =
    pytest -v {posargs}
dependency_groups = test

[testenv:py312-lowest]
runner = uv-venv-runner
constrain_package_deps = true
uv_resolution = lowest-direct

[testenv:py312-docs]
dependency_groups = docs
commands =
    sphinx-build -W -b html docs docs/_build/html {posargs}
