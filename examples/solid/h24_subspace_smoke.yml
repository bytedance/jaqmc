# Memory-conservative H24, M=2 server smoke test. Increase batch size only
# after recording stable peak memory and step time at each smaller size.

logging:
  level: info
  stream: stdout

jax:
  enable_x64: true

workflow:
  seed: 20260820
  batch_size: 4
  save_path: runs/h24_subspace_m2_smoke

system:
  module: two_atom_chain
  symbol: H
  bond_length: 2.0
  unit: bohr
  supercell: 12
  vacuum_separation: 20.0
  s_z: 0
  electron_init_width: 0.8

wf:
  hidden_dims_single: [256, 256, 256, 256]
  hidden_dims_double: [32, 32, 32, 32]
  ndets: 1
  distance_type: nu
  envelope_type: abs_isotropic
  full_det: true

reference:
  basis: sto-3g
  sample_fraction: 1.0
  verbose: 0
  method: KUHF

subspace:
  n_states: 2
  initialization:
    mode: random
  sampling:
    steps: 2
    initial_width: 0.02
    adapt_frequency: 100
    pmove_range: [0.5, 0.55]
  evaluation:
    vmap_chunk_size: 1
    pair_chunk_size: 1
    matrix_dtype: complex128
  diagnostics:
    condition_warning: 1.0e10
    solve_residual_warning: 1.0e-8
    max_imag_eigenvalue_warning: 1.0e-6

train:
  run:
    iterations: 3
    burn_in: 2
    save_time_interval: 0
    save_step_interval: 1
    timing_warmup_steps: 1
    stop_on_nan: loss
  optim:
    module: jaqmc.optimizer.optax:adam
    learning_rate: 1.0e-4
  grads:
    vmap_chunk_size: 1
    clip_method: mad
    clip_scale: 5.0

estimators:
  energy:
    kinetic:
      vmap_chunk_size: 1
      mode: forward_laplacian
      sparse: true
  enabled:
    spin: false
    density: false
