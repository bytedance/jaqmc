jax:
  enable_x64: true

system:
  rs: 1.0
  nspins: [1, 1]
  twist: [0.0, 0.0, 0.0]

workflow:
  seed: 42
  batch_size: 8
  save_path: ./runs/heg_cpu_smoke

wf:
  hidden_dims_single: [8]
  hidden_dims_double: [4]
  ndets: 1

sampler:
  steps: 1
  adapt_frequency: 2

pretrain:
  run:
    iterations: 1
    burn_in: 1
    timing_warmup_steps: 0
    save_step_interval: 1

train:
  run:
    iterations: 1
    burn_in: 1
    timing_warmup_steps: 0
    save_step_interval: 1
